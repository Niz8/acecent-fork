<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Acecent — Score Archive</title>
  <meta name="theme-color" content="#f5c518">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: #0a0a1a;
      color: #e8e8f0;
      font-family: 'Courier New', Courier, monospace;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 1.1rem;
      color: #f5c518;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }

    .header p {
      font-size: 0.65rem;
      color: #44446a;
      letter-spacing: 0.1em;
    }

    .date-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    input[type="date"] {
      flex: 1;
      background: #0d0d20;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      color: #e8e8f0;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.8rem;
      padding: 0.6rem 0.75rem;
      outline: none;
    }

    input[type="date"]:focus {
      border-color: #f5c518;
    }

    button {
      background: #f5c518;
      color: #0a0a1a;
      border: none;
      border-radius: 6px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 0.6rem 1rem;
      cursor: pointer;
      text-transform: uppercase;
      white-space: nowrap;
    }

    button:hover { background: #ffd740; }

    .status {
      font-size: 0.7rem;
      color: #44446a;
      text-align: center;
      margin-bottom: 1rem;
      min-height: 1.2rem;
      letter-spacing: 0.05em;
    }

    .scores-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .score-entry {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.65rem 0.9rem;
      background: #0d0d20;
      border: 1px solid #1a1a3a;
      border-radius: 6px;
    }

    .score-rank {
      font-size: 0.85rem;
      min-width: 1.8rem;
    }

    .score-name {
      font-size: 0.85rem;
      font-weight: 700;
      flex: 1;
    }

    .score-tier {
      font-size: 0.7rem;
      color: #6666aa;
    }

    .score-alt {
      font-size: 0.78rem;
      color: #aaaacc;
      white-space: nowrap;
    }

    .empty {
      font-size: 0.72rem;
      color: #44446a;
      text-align: center;
      padding: 2rem 0;
    }

    .footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.6rem;
      color: #2a2a4a;
      letter-spacing: 0.1em;
    }

    .footer a {
      color: #44446a;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🚀 Score Archive</h1>
      <p>Project Acecent · scores from May 2, 2026</p>
    </div>

    <div class="date-row">
      <input type="date" id="date-picker" />
      <button id="load-btn">Load</button>
    </div>

    <div class="status" id="status"></div>
    <div class="scores-list" id="scores-list"></div>

    <div class="footer">
      <a href="/acecent/">← Back to game</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.1/firebase-app.js';
    import { getFirestore, collection, getDocs, query, where, orderBy, limit } from 'https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyAp_zaKsyGfm_CKwzVuFCG_pWrk1zj9Df8",
      authDomain: "acecent.firebaseapp.com",
      projectId: "acecent",
      storageBucket: "acecent.firebasestorage.app",
      messagingSenderId: "825278282058",
      appId: "1:825278282058:web:bd33a484aa3229fbe9a9b3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const picker = document.getElementById('date-picker');
    const loadBtn = document.getElementById('load-btn');
    const status = document.getElementById('status');
    const list = document.getElementById('scores-list');

    // Default to today
    const today = new Date();
    const todayStr = today.toISOString().slice(0, 10);
    picker.value = todayStr;
    picker.min = '2026-05-02';
    picker.max = todayStr;

    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function dateToFirestore(dateStr) {
      // dateStr is YYYY-MM-DD, Firestore date field is YYYYMMDD
      return dateStr.replace(/-/g, '');
    }

    async function loadScores() {
      const dateStr = picker.value;
      if (!dateStr) return;

      status.textContent = 'Loading...';
      list.innerHTML = '';

      const firestoreDate = dateToFirestore(dateStr);

      try {
        const q = query(
          collection(db, 'scores'),
          where('date', '==', firestoreDate),
          orderBy('altitude', 'desc'),
          limit(50)
        );
        const snapshot = await getDocs(q);

        if (snapshot.empty) {
          status.textContent = '';
          list.innerHTML = `<div class="empty">No scores for this date.</div>`;
          return;
        }

        const scores = snapshot.docs.map(d => d.data());
        const displayDate = new Date(dateStr + 'T12:00:00').toLocaleDateString('en-US', {
          month: 'long', day: 'numeric', year: 'numeric'
        });

        status.textContent = `${scores.length} score${scores.length !== 1 ? 's' : ''} · ${displayDate}`;

        list.innerHTML = scores.map((entry, i) => {
          const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}.`;
          return `
            <div class="score-entry">
              <span class="score-rank">${medal}</span>
              <span class="score-name">${escapeHTML(entry.playerName)}</span>
              <span class="score-tier">${escapeHTML(entry.tierName)}</span>
              <span class="score-alt">${entry.altitude.toLocaleString()} ft</span>
            </div>
          `;
        }).join('');

      } catch (e) {
        status.textContent = 'Failed to load scores.';
        console.error(e);
      }
    }

    loadBtn.addEventListener('click', loadScores);
    picker.addEventListener('keydown', e => { if (e.key === 'Enter') loadScores(); });

    // Load today on start
    loadScores();
  </script>
</body>
</html>
